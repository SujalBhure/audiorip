plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.sujalbhure.audiorip'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sujalbhure.audiorip'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.1.0'

        // Python 3.11 keeps 32-bit ARM compatibility while supporting current
        // arm64 phones and x86 emulators.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def password = System.getenv('AUDIORIP_KEYSTORE_PASSWORD') ?: 'audiorip123'
            storeFile file('release.keystore')
            storePassword password
            keyAlias 'audiorip'
            keyPassword password
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            python.srcDirs = ['python']
        }
    }
}

chaquopy {
    defaultConfig {
        buildPython 'C:/Users/SUJAL/AppData/Roaming/uv/python/cpython-3.11-windows-x86_64-none/python.exe'
        version = '3.11'
        pip {
            install 'yt-dlp==2026.8.19'
        }
    }
}

dependencies {
    // GPL build provides the MP3 encoder needed for an entirely local pipeline.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.7'
}
